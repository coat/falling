name: Build

# Builds every version of the game. Called by ci.yml on pull requests and by
# release.yml on tags, so both build exactly the same way.

on:
  workflow_call:
    inputs:
      version:
        description: Name for the packages, such as v1.2.3. Defaults to the short commit SHA.
        type: string
        default: ""
      release:
        description: Sign the APK with the release key. Fails if the signing secrets are missing.
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  # On pull requests, github.sha is a temporary merge commit that is not on
  # the branch, so name the packages after the branch's own commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # SDL is built from source and linked statically, so one Linux runner
  # cross-compiles all of these. Linux binaries still link glibc dynamically,
  # as SDL loads X11, Wayland and GL at runtime; 2.30 matches PortMaster.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            target: x86_64-linux-gnu.2.30
          - name: aarch64-linux
            target: aarch64-linux-gnu.2.30
          - name: x86_64-windows
            target: x86_64-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip -Dlink_sdl=false --prefix out --summary all

      - name: Package
        run: tools/package.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falling-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # SDL needs the macOS SDK, which only a Mac runner has. Zig 0.17 cannot hand
  # the SDK to SDL for a cross-compile, so each architecture builds natively.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            os: macos-latest
          - name: x86_64-macos
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dstrip --prefix out --summary all

      - name: Package
        run: tools/package.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falling-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  portmaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Dportmaster -Doptimize=ReleaseFast -Dstrip --prefix out --summary all

      # PortMaster names the port after the zip, so it must stay falling.zip.
      - name: Package
        run: |
          mkdir dist
          cd out/portmaster
          zip -r ../../dist/falling.zip falling.sh falling

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falling-portmaster
          path: dist/falling.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell has the Android SDK and NDK versions build.zig asks for.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check signing secrets are present
        if: inputs.release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets. See .github/workflows/README.md#set-up-the-repository-once"
            exit 1
          fi

      # Outside the checkout, so the key can never end up in an artifact.
      - name: Decode keystore
        if: inputs.release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_ARG=-Dandroid_keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Without a keystore, build.zig signs with a throwaway debug key, which
      # is what pull requests (and forks, which get no secrets) need.
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: nix develop .#android -c zig build -Dandroid -Doptimize=ReleaseSmall ${KEYSTORE_ARG:+"$KEYSTORE_ARG"} --prefix out --summary all

      - name: Delete keystore
        if: always() && inputs.release
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Package
        run: |
          mkdir dist
          cp out/bin/falling.apk "dist/falling-${VERSION:-${COMMIT::7}}.apk"
          # shellcheck disable=SC2016 # expanded inside the dev shell
          nix develop .#android -c sh -c '"$ANDROID_HOME"/build-tools/36.1.0/apksigner verify --print-certs dist/*.apk'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falling-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Only emscripten and zig, from the flake's pinned nixpkgs: the full dev
      # shell would also download the Android SDK.
      - name: Build
        run: |
          nix shell --inputs-from . nixpkgs#emscripten nixpkgs#zig -c sh -c '
            . ./tools/sysroot.sh
            zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall --prefix out --summary all
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: out/www
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
