name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - .gitignore
      - .envrc
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      # Named, as zig-pkg holds dependencies that are not ours to format.
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      # The runner has no SDL3 installed, so build it from source.
      - name: Run tests
        run: zig build test -Dlink_sdl=false --summary all

  build:
    uses: ./.github/workflows/build.yml
